name: RecDrivePad
options:
  bundleIdPrefix: com.recdrive
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    ENABLE_PREVIEWS: true
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  RecDrivePad:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Networking
      - path: Views
      - path: ../SharedProtocol
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "RecDrive Pad"
        NSLocalNetworkUsageDescription: "RecDrive Pad necessita dell'accesso alla rete locale per connettersi al Mac, trasmettere lo schermo in tempo reale e ricevere i tratti di Apple Pencil."
        NSBonjourServices:
          - "_recdrive-pad._tcp"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.recdrive.pad
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
